<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
  <div class="container-cards">
    <div class="card">
      <img src="images/image-equilibrium.jpg" alt="Image NFT Equilibrium">
      <div class="tittle-description">
        <h1>Equilibrium #3429</h1>
        <p>Our Equilibrium collection promotes balance and calm.</p>
      </div>
      <div class="price-time">
        <span><img src="images/icon-ethereum.svg" alt="Image icon Ethereum"> 0.041 ETH</span>
         <span><img src="images/icon-clock.svg" alt="Image icon Time">3 days left</span>
      </div>
      <div class="creator">
         <img src="images/image-avatar.png" alt="Avatar user">
         <span>Creation of <strong>Jules Wyvern</strong></span>
      </div>
    </div>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Iván Gómez</a>.
    </div>
  </div>
</body>
</html>
