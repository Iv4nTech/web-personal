<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web grid - Iván Gómez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="items">
                <div class="tittle">
                    <h1>Team Builder</h1>
                </div>
                <div class="description">
                    <p>Scans our talent network to create the optimal team for your porject</p>
                </div>
                <div class="icons">
                    <img src="./svg/icon-team-builder.svg" alt="Icon home and terminal">
                </div>
            </div>
            <div class="items">
                 <div class="tittle">
                    <h1>Calculator</h1>
                </div>
                <div class="description">
                    <p>Uses data from post projects to provide better delivery estimates</p>
                </div>
                <div class="icons">
                    <img src="./svg/icon-calculator.svg" alt="Icon monitor in screen stats">
                </div>
            </div>
            <div class="items">
                 <div class="tittle">
                    <h1>Karma</h1>
                </div>
                <div class="description">
                    <p>Regularly evaluates our talent to ensure quality</p>
                </div>
                <div class="icons">
                    <img src="./svg/icon-karma.svg" alt="Icon light bulb">
                </div>
            </div>
             <div class="items">
                 <div class="tittle">
                    <h1>Supervisor</h1>
                </div>
                <div class="description">
                    <p>Monitors activity to identify project roadblocks</p>
                </div>
                <div class="icons">
                    <img src="./svg/icon-supervisor.svg" alt="Icon Magnifying glassl">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
